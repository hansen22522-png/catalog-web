<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>线下项目-子件报价 Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="https://i.ibb.co/GQrKrr91/offline-channel.png">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#475569',
          }
        }
      }
    }
  </script>
  <style>
    .drawer-mask{transition:0.3s;background:rgba(0,0,0,0.4);}
    .drawer-panel{transition:transform 0.3s;transform:translateX(100%);}
    .drawer-panel.open{transform:translateX(0);}
    .tag{@apply bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs mr-1 mb-1 inline-block;}
    .card-hover{transition:all 0.2s ease;}
    .card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.1);}
    .prod-img{width:100%;height:100%;object-fit:contain;background:#f8fafc;}
    .cat-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
    .cat1-section{margin-bottom:24px;}
    .cat1-title{font-size:16px;font-weight:700;color:#1e293b;border-left:4px solid #2563eb;padding-left:10px;margin-bottom:12px;}
    .drop-zone{border:2px dashed #cbd5e1;border-radius:8px;transition:all 0.2s;cursor:pointer;}
    .drop-zone.dragover{border-color:#2563eb;background:#eff6ff;}
    .edit-input{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;}
    .edit-input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,0.15);}
    .edit-label{font-size:12px;font-weight:500;color:#475569;margin-bottom:3px;display:block;}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:10px 20px;border-radius:8px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
    .toast.show{opacity:1;}
    .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}
    .sync-ok{background:#22c55e;}
    .sync-fail{background:#ef4444;}
    .sync-loading{background:#eab308;animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  </style>
</head>
<body class="bg-gray-50 text-slate-800">
<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Top Nav -->
<header class="bg-white shadow-sm sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
    <h1 class="text-lg font-bold text-primary shrink-0">子件库 Catalog</h1>
    <div class="relative flex-1 max-w-xl min-w-[200px]">
      <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input id="searchInput" type="text" placeholder="搜索：子件名称 / SKU / 英文名"
             class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40"/>
    </div>
    <div class="flex items-center gap-2 shrink-0 flex-wrap">
      <!-- 飞书同步状态 -->
      <div id="syncStatus" class="flex items-center text-xs bg-slate-100 px-3 py-2 rounded-lg" title="数据来源">
        <span id="syncDot" class="sync-dot sync-loading"></span>
        <span id="syncText">同步中...</span>
      </div>
      <button id="syncBtn" class="bg-emerald-600 text-white px-3 py-2 rounded-lg hover:bg-emerald-700" title="从飞书重新拉取数据">
        <i class="fa fa-refresh"></i> 同步
      </button>
      <label class="flex items-center gap-1.5 text-sm cursor-pointer bg-slate-100 px-3 py-2 rounded-lg hover:bg-slate-200" title="本地编辑（不会写回飞书）">
        <input type="checkbox" id="editModeToggle" class="rounded"/>
        <span><i class="fa fa-pencil"></i> 编辑模式</span>
      </label>
      <button id="addBtn" class="bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700 hidden" title="新增产品（同步到飞书）">
        <i class="fa fa-plus"></i> 新增
      </button>
      <button id="cartBtn" class="relative bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700">
        <i class="fa fa-shopping-cart mr-1"></i>加购清单
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
      </button>
    </div>
  </div>
  <!-- 同步提示条 -->
  <div id="syncBanner" class="hidden bg-amber-50 border-b border-amber-200 px-4 py-2 text-sm text-amber-800">
    <i class="fa fa-exclamation-triangle mr-1"></i>
    <span id="syncBannerText">无法连接飞书，当前显示本地缓存数据。请检查后端服务或点击"同步"重试。</span>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 pt-5 pb-16">
  <div class="flex flex-col md:flex-row gap-5">
    <!-- Side Filter -->
    <aside class="md:w-64 shrink-0">
      <div class="bg-white rounded-lg shadow p-4 sticky top-20">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-semibold">筛选条件</h3>
          <button id="resetFilterBtn" class="text-xs text-primary">重置全部</button>
        </div>
        <div class="mb-4">
          <div class="text-sm font-medium mb-2">类别1</div>
          <div id="cat1Wrap" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div class="mb-4">
          <div class="text-sm font-medium mb-2">类别2</div>
          <div id="cat2Wrap" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div class="mb-4">
          <div class="text-sm font-medium mb-2">成本区间</div>
          <div class="flex gap-2 items-center">
            <input id="minCost" type="number" placeholder="最小" class="w-1/2 border rounded px-2 py-1 text-sm"/>
            <span>~</span>
            <input id="maxCost" type="number" placeholder="最大" class="w-1/2 border rounded px-2 py-1 text-sm"/>
          </div>
        </div>
        <div class="mb-4">
          <div class="text-sm font-medium mb-2">排序</div>
          <select id="sortSelect" class="w-full border rounded px-2 py-1.5 text-sm">
            <option value="costAsc">成本从低到高</option>
            <option value="costDesc">成本从高到低</option>
            <option value="nameAsc">按名称A-Z</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" id="groupByCat1" class="rounded"/>
            <span>按类别1分组显示</span>
          </label>
        </div>
      </div>
    </aside>
    <!-- Main List -->
    <main class="flex-1">
      <div class="flex justify-between items-center mb-4">
        <div class="text-sm text-slate-500">共 <span id="resultCount">0</span> 条子件</div>
        <div class="flex gap-2">
          <button data-view="grid" class="viewBtn px-3 py-1 border rounded bg-primary text-white"><i class="fa fa-th"></i> 网格</button>
          <button data-view="list" class="viewBtn px-3 py-1 border rounded bg-white"><i class="fa fa-list"></i> 列表</button>
        </div>
      </div>
      <div id="cardContainer"></div>
    </main>
  </div>
</div>

<!-- Cart Drawer -->
<div id="cartMask" class="drawer-mask fixed inset-0 z-40 hidden"></div>
<div id="cartDrawer" class="drawer-panel fixed right-0 top-0 bottom-0 w-full md:w-[440px] bg-white shadow-xl z-50 flex flex-col">
  <div class="px-5 py-4 border-b flex justify-between items-center">
    <h2 class="text-lg font-bold">加购清单</h2>
    <button id="closeCartBtn" class="text-xl text-slate-500"><i class="fa fa-times"></i></button>
  </div>
  <div id="cartListWrap" class="flex-1 overflow-auto p-4">
    <div id="cartEmptyTip" class="text-center text-slate-400 py-10">暂无子件，请从列表加入</div>
    <div id="cartItemWrap" class="space-y-4 hidden"></div>
  </div>
  <div class="border-t p-4">
    <div class="text-sm mb-1">总数量：<span id="cartTotalQty">0</span></div>
    <div class="text-sm mb-3">预估总成本：<span id="cartTotalCost" class="font-bold text-primary">0.00</span> 元</div>
    <div class="flex gap-2">
      <button id="exportCsvBtn" class="flex-1 bg-primary text-white py-2 rounded-lg"><i class="fa fa-download mr-1"></i>导出CSV</button>
      <button id="clearCartBtn" class="bg-slate-200 px-4 py-2 rounded-lg">清空</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailMask" class="fixed inset-0 z-50 bg-black/40 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] overflow-auto">
    <div class="p-5 border-b flex justify-between items-center">
      <h3 id="detailTitle" class="text-lg font-bold"></h3>
      <button id="closeDetailBtn" class="text-xl text-slate-500"><i class="fa fa-times"></i></button>
    </div>
    <div id="detailBody" class="p-5"></div>
    <div class="px-5 pb-5">
      <div class="flex items-center gap-3">
        <div class="flex items-center border rounded">
          <button id="detailMinus" class="px-3 py-1.5">-</button>
          <input id="detailQty" value="1" min="1" class="w-12 text-center border-x py-1.5"/>
          <button id="detailPlus" class="px-3 py-1.5">+</button>
        </div>
        <button id="detailAddCartBtn" class="bg-primary text-white px-5 py-1.5 rounded-lg">加入清单</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editMask" class="fixed inset-0 z-50 bg-black/40 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-lg w-full max-w-3xl max-h-[92vh] overflow-auto">
    <div class="p-5 border-b flex justify-between items-center sticky top-0 bg-white">
      <h3 id="editTitle" class="text-lg font-bold">编辑产品</h3>
      <button id="closeEditBtn" class="text-xl text-slate-500"><i class="fa fa-times"></i></button>
    </div>
    <div class="p-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div class="md:col-span-1">
          <label class="edit-label">产品图片（拖拽或点击上传）</label>
          <div id="dropZone" class="drop-zone w-full h-48 flex items-center justify-center relative overflow-hidden bg-slate-50">
            <img id="editImgPreview" class="prod-img absolute inset-0 hidden" alt="预览"/>
            <div id="dropPlaceholder" class="text-center text-slate-400 text-sm p-4">
              <i class="fa fa-cloud-upload text-3xl mb-2"></i>
              <div>拖拽图片到此处</div>
              <div class="text-xs mt-1">或点击选择文件</div>
            </div>
            <input type="file" id="editImgInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer"/>
          </div>
          <button id="removeImgBtn" class="mt-2 text-xs text-red-500 hidden"><i class="fa fa-trash"></i> 移除图片</button>
        </div>
        <div class="md:col-span-2 grid grid-cols-2 gap-3">
          <div class="col-span-2">
            <label class="edit-label">子件名称 *</label>
            <input id="f_name" class="edit-input" placeholder="如：MO-指缘油15ml"/>
          </div>
          <div>
            <label class="edit-label">类别1 *</label>
            <input id="f_cat1" class="edit-input" placeholder="如：半成品" list="cat1List"/>
            <datalist id="cat1List"></datalist>
          </div>
          <div>
            <label class="edit-label">类别2 *</label>
            <input id="f_cat2" class="edit-input" placeholder="如：指缘油" list="cat2List"/>
            <datalist id="cat2List"></datalist>
          </div>
          <div class="col-span-2">
            <label class="edit-label">英文名</label>
            <input id="f_enName" class="edit-input" placeholder="如：Cuticle Oil (15ml) x 1"/>
          </div>
          <div>
            <label class="edit-label">瓶身材质</label>
            <input id="f_material" class="edit-input" placeholder="如：PP / 玻璃瓶"/>
          </div>
          <div>
            <label class="edit-label">容量/规格</label>
            <input id="f_capacity" class="edit-input" placeholder="如：7ml / 125*20mm"/>
          </div>
          <div>
            <label class="edit-label">印刷工艺</label>
            <input id="f_print" class="edit-input" placeholder="如：丝印"/>
          </div>
          <div>
            <label class="edit-label">成本(元) *</label>
            <input id="f_cost" type="number" step="0.01" class="edit-input" placeholder="如：2.40"/>
          </div>
          <div>
            <label class="edit-label">参考SKU</label>
            <input id="f_sku" class="edit-input" placeholder="如：AB208020009A"/>
          </div>
          <div>
            <label class="edit-label">重量(kg)</label>
            <input id="f_weightKg" type="number" step="0.001" class="edit-input" placeholder="如：0.075"/>
          </div>
          <div class="col-span-2">
            <label class="edit-label">备注</label>
            <textarea id="f_remark" class="edit-input" rows="2" placeholder="备注信息"></textarea>
          </div>
        </div>
      </div>
      <div class="mt-3 text-xs text-blue-600 bg-blue-50 p-2 rounded">
        <i class="fa fa-info-circle"></i> 修改将直接同步到飞书多维表格。本地拖拽上传的图片暂不同步（请在飞书中粘贴图片URL）。
      </div>
    </div>
    <div class="px-5 pb-5 flex justify-between items-center sticky bottom-0 bg-white border-t pt-4">
      <button id="deleteInEditBtn" class="text-red-500 text-sm hidden"><i class="fa fa-trash"></i> 删除此产品</button>
      <div class="flex gap-2 ml-auto">
        <button id="cancelEditBtn" class="bg-slate-200 px-5 py-2 rounded-lg">取消</button>
        <button id="saveEditBtn" class="bg-primary text-white px-5 py-2 rounded-lg"><i class="fa fa-save"></i> 保存</button>
      </div>
    </div>
  </div>
</div>

<script>

// ==================== 数据持久化 ====================
const STORAGE_KEY = 'catalogData_feishu_v1';
const LAST_SYNC_KEY = 'catalogLastSync_v1';
function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(rawData));
}
let rawData = loadData();

  viewMode:'grid',
  search:'',
  selectedCat1:[],
  selectedCat2:[],
  minCost:null,
  maxCost:null,
  sort:'costAsc',
  groupByCat1:false,
  editMode:false,
  cart:JSON.parse(localStorage.getItem('subCart')||'[]'),
  detailItem:null,
  editIndex:-1,
  editImg:'',
  syncStatus:'loading' // loading / ok / fail
};

const $$=s=>document.querySelectorAll(s);

// ==================== Toast ====================
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// ==================== 飞书同步 ====================
async function syncFromFeishu(){
  if(API_BASE === 'YOUR_API_BASE_URL'){
    setSyncStatus('fail', '未配置API');
    $('#syncBanner').classList.remove('hidden');
    $('#syncBannerText').textContent = '未配置后端API地址。请在HTML中修改 API_BASE 为你的代理服务地址，或使用本地数据。';
    return false;
  }
  setSyncStatus('loading', '同步中...');
  try{
    const resp = await fetch(API_BASE + '/api/records', {cache:'no-store'});
    const data = await resp.json();
    if(data.error || !Array.isArray(data.records)){
      throw new Error(data.error || '返回数据格式错误');
    }
    if(data.records.length === 0){
      throw new Error('飞书表格为空');
    }
    rawData = data.records;
    saveData();
    localStorage.setItem(LAST_SYNC_KEY, new Date().toLocaleString('zh-CN'));
    setSyncStatus('ok', `已同步 ${data.count} 条`);
    $('#syncBanner').classList.add('hidden');
    renderFilterOptions();
    renderList();
    showToast(`从飞书同步了 ${data.count} 条数据`);
    return true;
  }catch(err){
    console.error('同步失败:', err);
    setSyncStatus('fail', '同步失败');
    $('#syncBanner').classList.remove('hidden');
    $('#syncBannerText').textContent = `无法连接飞书（${err.message}），当前显示本地缓存数据。点击"同步"重试。`;
    return false;
  }
}

function setSyncStatus(status, text){
  state.syncStatus = status;
  const dot = $('#syncDot');
  dot.className = 'sync-dot ' + (status==='ok'?'sync-ok':status==='fail'?'sync-fail':'sync-loading');
  $('#syncText').textContent = text;
}

// ==================== 初始化 ====================
async function init(){
  renderFilterOptions();
  renderList();
  renderCart();
  bindEvents();
  // 自动从飞书同步
  await syncFromFeishu();
}

// ==================== 筛选标签 ====================
function renderFilterOptions(){
  const cat1Set = [...new Set(rawData.map(d=>d.cat1))];
  const cat2Set = [...new Set(rawData.map(d=>d.cat2))];
  $('#cat1Wrap').innerHTML = cat1Set.map(c=>tagTpl(c,'cat1')).join('');
  $('#cat2Wrap').innerHTML = cat2Set.map(c=>tagTpl(c,'cat2')).join('');
  $('#cat1List').innerHTML = cat1Set.map(c=>`<option value="${c}">`).join('');
  $('#cat2List').innerHTML = cat2Set.map(c=>`<option value="${c}">`).join('');
}
function tagTpl(val,type){
  const active = (type==='cat1'?state.selectedCat1:state.selectedCat2).includes(val);
  return `<span class="tag cursor-pointer border ${active?'bg-primary text-white border-primary':'border-slate-200'}" data-type="${type}" data-val="${val}">${val}</span>`;
}

// ==================== 过滤排序 ====================
function getFilteredList(){
  let arr = [...rawData];
  if(state.search.trim()){
    const kw = state.search.trim().toLowerCase();
    arr = arr.filter(d=>
      (d.name||'').toLowerCase().includes(kw)||
      (d.enName||'').toLowerCase().includes(kw)||
      (d.sku||'').toLowerCase().includes(kw)
    )
  }
  if(state.selectedCat1.length>0) arr = arr.filter(d=>state.selectedCat1.includes(d.cat1));
  if(state.selectedCat2.length>0) arr = arr.filter(d=>state.selectedCat2.includes(d.cat2));
  if(state.minCost!==null) arr = arr.filter(d=>d.cost>=state.minCost);
  if(state.maxCost!==null) arr = arr.filter(d=>d.cost<=state.maxCost);
  if(state.sort==='costAsc') arr.sort((a,b)=>a.cost-b.cost);
  else if(state.sort==='costDesc') arr.sort((a,b)=>b.cost-a.cost);
  else if(state.sort==='nameAsc') arr.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  return arr;
}

// ==================== 图片HTML ====================
function imgHtml(d, cls){
  if(d.img){
    return `<img src="${d.img}" alt="${d.name}" class="${cls}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div class="${cls} items-center justify-center text-slate-400" style="display:none"><i class="fa fa-picture-o text-3xl"></i></div>`;
  }
  return `<div class="${cls} items-center justify-center text-slate-400"><i class="fa fa-picture-o text-3xl"></i></div>`;
}

// ==================== 渲染列表 ====================
function renderList(){
  const list = getFilteredList();
  $('#resultCount').textContent = list.length;
  const container = $('#cardContainer');
  if(state.groupByCat1 && state.viewMode==='grid'){
    const groups = {};
    list.forEach(d=>{
      if(!groups[d.cat1]) groups[d.cat1]=[];
      groups[d.cat1].push(d);
    });
    container.className = '';
    container.innerHTML = Object.keys(groups).map(cat1=>`
      <div class="cat1-section">
        <div class="cat1-title">${cat1} <span class="text-xs font-normal text-slate-400">(${groups[cat1].length}件)</span></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${groups[cat1].map(d=>cardGridTpl(d)).join('')}
        </div>
      </div>
    `).join('');
  }else if(state.viewMode==='grid'){
    container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
    container.innerHTML = list.map(d=>cardGridTpl(d)).join('');
  }else{
    container.className = 'grid grid-cols-1 gap-3';
    container.innerHTML = list.map(d=>cardListTpl(d)).join('');
  }
}

      <div><span class="text-slate-500">重量(kg)：</span>${item.weightKg||'-'}</div>
      <div><span class="text-slate-500">成本：</span><span class="text-primary font-bold text-base">¥${Number(item.cost).toFixed(2)}</span></div>
      <div><span class="text-slate-500">备注：</span><div class="text-xs mt-1 text-slate-600 whitespace-pre-wrap">${item.remark||'-'}</div></div>
    </div>
  </div>`;
  $('#detailMask').classList.remove('hidden');
}
function closeDetail(){ $('#detailMask').classList.add('hidden'); state.detailItem=null; }

// ==================== 编辑弹窗 ====================
function openEdit(idx){
  state.editIndex = idx;
  const isNew = idx < 0;
  $('#editTitle').textContent = isNew ? '新增产品' : '编辑产品';
  $('#deleteInEditBtn').classList.toggle('hidden', isNew);
  const d = isNew ? {cat1:'',cat2:'',name:'',enName:'',material:'',capacity:'',print:'',cost:'',sku:'',weightKg:'',remark:'',img:''} : rawData[idx];
  state.editImg = d.img || '';
  $('#f_name').value = d.name||'';
  $('#f_cat1').value = d.cat1||'';
  $('#f_cat2').value = d.cat2||'';
  $('#f_enName').value = d.enName||'';
  $('#f_material').value = d.material||'';
  $('#f_capacity').value = d.capacity||'';
  $('#f_print').value = d.print||'';
  $('#f_cost').value = d.cost!==undefined&&d.cost!==''?d.cost:'';
  $('#f_sku').value = d.sku||'';
  $('#f_weightKg').value = d.weightKg!==undefined&&d.weightKg!==''?d.weightKg:'';
  $('#f_remark').value = d.remark||'';
  updateEditImgPreview();
  $('#editMask').classList.remove('hidden');
}
function closeEdit(){ $('#editMask').classList.add('hidden'); state.editIndex=-1; state.editImg=''; }

function updateEditImgPreview(){
  const img = $('#editImgPreview');
  const ph = $('#dropPlaceholder');
  const rmBtn = $('#removeImgBtn');
  if(state.editImg){
    img.src = state.editImg;
    img.classList.remove('hidden');
    ph.classList.add('hidden');
    rmBtn.classList.remove('hidden');
  }else{
    img.classList.add('hidden');
    ph.classList.remove('hidden');
    rmBtn.classList.add('hidden');
  }
}

function handleFile(file){
  if(!file || !file.type.startsWith('image/')){ showToast('请选择图片文件'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    state.editImg = e.target.result;
    updateEditImgPreview();
    showToast('图片已添加');
  };
  reader.readAsDataURL(file);
}

async function saveEdit(){
  const name = $('#f_name').value.trim();
  const cat1 = $('#f_cat1').value.trim();
  const cat2 = $('#f_cat2').value.trim();
  const costVal = $('#f_cost').value;
  if(!name){ showToast('请填写子件名称'); return; }
  if(!cat1){ showToast('请填写类别1'); return; }
  if(!cat2){ showToast('请填写类别2'); return; }
  if(costVal===''||isNaN(Number(costVal))){ showToast('请填写有效成本'); return; }
  const item = {
    cat1, cat2, name,
    enName: $('#f_enName').value.trim(),
    material: $('#f_material').value.trim(),
    capacity: $('#f_capacity').value.trim(),
    print: $('#f_print').value.trim(),
    cost: Number(costVal),
    sku: $('#f_sku').value.trim(),
    weightKg: $('#f_weightKg').value!==''?Number($('#f_weightKg').value):'',
    remark: $('#f_remark').value.trim(),
    img: state.editImg
  };
  const saveBtn = $('#saveEditBtn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 保存中...';
  try{
    const isNew = state.editIndex < 0;
    const recordId = isNew ? '' : (rawData[state.editIndex]?.record_id || '');
    // base64 本地图片不同步到飞书
    const payload = {...item};
    if(payload.img && payload.img.startsWith('data:image')){
      delete payload.img;
    }
    let url, method;
    if(isNew){
      url = API_BASE + '/api/records';
      method = 'POST';
    }else{
      url = API_BASE + '/api/records/' + recordId;
      method = 'PUT';
    }
    const resp = await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error);
    showToast(isNew ? '已新增并同步到飞书' : '已保存并同步到飞书');
    closeEdit();
    await syncFromFeishu();
  }catch(err){
    showToast('保存失败：' + err.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.innerHTML = '<i class="fa fa-save"></i> 保存';
  }
}

async function deleteItem(idx){
  if(idx<0||idx>=rawData.length) return false;
  const item = rawData[idx];
  if(!confirm(`确定删除「${item.name}」吗？将同步删除飞书表格中的数据。`)) return false;
  try{
    const recordId = item.record_id || '';
    const resp = await fetch(API_BASE + '/api/records/' + recordId, {method: 'DELETE'});
    const data = await resp.json();
    if(data.error) throw new Error(data.error);
    showToast('已删除并同步到飞书');
    await syncFromFeishu();
    return true;
  }catch(err){
    showToast('删除失败：' + err.message);
    return false;
  }
}

// ==================== 购物车 ====================
function saveCart(){ localStorage.setItem('subCart',JSON.stringify(state.cart)); }
function addToCart(item,qty=1){
  const existIdx = state.cart.findIndex(c=>c.sku===item.sku&&c.name===item.name);
  if(existIdx>=0){ state.cart[existIdx].qty += qty; }
  else{ state.cart.push({...item,qty}); }
  saveCart(); renderCart();
}
function renderCart(){
  const badge = $('#cartBadge');
  const totalQty = state.cart.reduce((s,i)=>s+i.qty,0);
  const totalCost = state.cart.reduce((s,i)=>s+i.qty*Number(i.cost),0);
  $('#cartTotalQty').textContent = totalQty;
  $('#cartTotalCost').textContent = totalCost.toFixed(2);
  if(totalQty>0){ badge.classList.remove('hidden'); badge.textContent=totalQty; }
  else{ badge.classList.add('hidden'); }
  const emptyTip = $('#cartEmptyTip');
  const itemWrap = $('#cartItemWrap');
  if(state.cart.length===0){ emptyTip.classList.remove('hidden'); itemWrap.classList.add('hidden'); return; }
  emptyTip.classList.add('hidden'); itemWrap.classList.remove('hidden');
  itemWrap.innerHTML = state.cart.map((c,idx)=>`
  <div class="border rounded p-3">
    <div class="font-medium text-sm">${c.name}</div>
    <div class="text-xs text-slate-500">SKU:${c.sku||'-'}｜¥${Number(c.cost).toFixed(2)}</div>
    <div class="flex justify-between items-center mt-2">
      <div class="flex items-center border rounded">
        <button data-idx="${idx}" class="cartMinus px-2 py-0.5">-</button>
        <span class="w-8 text-center">${c.qty}</span>
        <button data-idx="${idx}" class="cartPlus px-2 py-0.5">+</button>
      </div>
      <div class="text-sm">小计：¥${(Number(c.cost)*c.qty).toFixed(2)}</div>
      <button data-idx="${idx}" class="cartDel text-red-500"><i class="fa fa-trash"></i></button>
    </div>
  </div>`).join('');
}
function openCart(){ $('#cartMask').classList.remove('hidden'); $('#cartDrawer').classList.add('open'); }
function closeCart(){ $('#cartMask').classList.add('hidden'); $('#cartDrawer').classList.remove('open'); }

function exportCartCsv(){
  const header = ['类别1','类别2','子件名称','英文名','SKU','成本(元)','数量','小计(元)','重量kg','备注'];
  const rows = state.cart.map(i=>[
    i.cat1,i.cat2,i.name,i.enName,i.sku,i.cost,i.qty,(Number(i.cost)*i.qty).toFixed(2),i.weightKg||'',(i.remark||'').replace(/\n/g,' ')
  ]);
  const csv = [header,...rows].map(r=>r.map(cell=>`"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '子件加购清单.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ==================== 事件绑定 ====================
function bindEvents(){
  $('#searchInput').addEventListener('input',e=>{ state.search=e.target.value; renderList(); });
  $$('.viewBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.viewMode = btn.dataset.view;
      $$('.viewBtn').forEach(b=>{ b.classList.remove('bg-primary','text-white'); b.classList.add('bg-white'); });
      btn.classList.add('bg-primary','text-white');
      renderList();
    });
  });
  $('#cat1Wrap').addEventListener('click',e=>{
    const t=e.target.closest('.tag'); if(!t)return;
    const val=t.dataset.val;
    if(state.selectedCat1.includes(val)) state.selectedCat1=state.selectedCat1.filter(x=>x!==val);
    else state.selectedCat1.push(val);
    renderFilterOptions();renderList();
  });
  $('#cat2Wrap').addEventListener('click',e=>{
    const t=e.target.closest('.tag'); if(!t)return;
    const val=t.dataset.val;
    if(state.selectedCat2.includes(val)) state.selectedCat2=state.selectedCat2.filter(x=>x!==val);
    else state.selectedCat2.push(val);
    renderFilterOptions();renderList();
  });
  $('#minCost').addEventListener('change',e=>{state.minCost=e.target.value?Number(e.target.value):null;renderList()});
  $('#maxCost').addEventListener('change',e=>{state.maxCost=e.target.value?Number(e.target.value):null;renderList()});
  $('#sortSelect').addEventListener('change',e=>{state.sort=e.target.value;renderList()});
  $('#groupByCat1').addEventListener('change',e=>{state.groupByCat1=e.target.checked;renderList()});
  $('#resetFilterBtn').addEventListener('click',()=>{
    state.selectedCat1=[];state.selectedCat2=[];state.minCost=null;state.maxCost=null;state.search='';
    $('#searchInput').value='';$('#minCost').value='';$('#maxCost').value='';
    renderFilterOptions();renderList();
  });
  // 同步按钮
  $('#syncBtn').addEventListener('click',()=>syncFromFeishu());
  // 本地编辑模式
  $('#editModeToggle').addEventListener('change',e=>{
    state.editMode = e.target.checked;
    $('#addBtn').classList.toggle('hidden', !state.editMode);
    renderList();
  });
  $('#addBtn').addEventListener('click',()=>openEdit(-1));
  $('#cardContainer').addEventListener('click',e=>{
    const dBtn=e.target.closest('.detailBtn');
    const aBtn=e.target.closest('.addCartBtn');
    const eBtn=e.target.closest('.editItemBtn');
    const delBtn=e.target.closest('.delItemBtn');
    if(dBtn){ openDetail(rawData[Number(dBtn.dataset.idx)]); }
    if(aBtn){ addToCart(rawData[Number(aBtn.dataset.idx)],1); }
    if(eBtn){ openEdit(Number(eBtn.dataset.idx)); }
    if(delBtn){ deleteItem(Number(delBtn.dataset.idx)); }
  });
  $('#closeDetailBtn').addEventListener('click',closeDetail);
  $('#detailMask').addEventListener('click',e=>{if(e.target===$('#detailMask'))closeDetail()});
  $('#detailMinus').addEventListener('click',()=>{const i=$('#detailQty');i.value=Math.max(1,Number(i.value)-1)});
  $('#detailPlus').addEventListener('click',()=>{const i=$('#detailQty');i.value=Number(i.value)+1});
  $('#detailAddCartBtn').addEventListener('click',()=>{
    if(!state.detailItem)return;
    addToCart(state.detailItem,Number($('#detailQty').value)||1);
    closeDetail();openCart();
  });
  $('#cartBtn').addEventListener('click',openCart);
  $('#closeCartBtn').addEventListener('click',closeCart);
  $('#cartMask').addEventListener('click',e=>{if(e.target===$('#cartMask'))closeCart()});
  $('#cartItemWrap').addEventListener('click',e=>{
    const plus=e.target.closest('.cartPlus');const minus=e.target.closest('.cartMinus');const del=e.target.closest('.cartDel');
    if(plus){const idx=Number(plus.dataset.idx);state.cart[idx].qty+=1;saveCart();renderCart();}
    if(minus){const idx=Number(minus.dataset.idx);state.cart[idx].qty=Math.max(1,state.cart[idx].qty-1);saveCart();renderCart();}
    if(del){const idx=Number(del.dataset.idx);state.cart.splice(idx,1);saveCart();renderCart();}
  });
  $('#clearCartBtn').addEventListener('click',()=>{state.cart=[];saveCart();renderCart();});
  $('#exportCsvBtn').addEventListener('click',exportCartCsv);
  $('#closeEditBtn').addEventListener('click',closeEdit);
  $('#cancelEditBtn').addEventListener('click',closeEdit);
  $('#editMask').addEventListener('click',e=>{if(e.target===$('#editMask'))closeEdit()});
  $('#saveEditBtn').addEventListener('click',saveEdit);
  $('#deleteInEditBtn').addEventListener('click', async ()=>{
    if(state.editIndex>=0){
      const ok = await deleteItem(state.editIndex);
      if(ok) closeEdit();
    }
  });
  $('#removeImgBtn').addEventListener('click',()=>{state.editImg='';updateEditImgPreview();});
  $('#editImgInput').addEventListener('change',e=>{
    if(e.target.files[0]) handleFile(e.target.files[0]);
  });
  const dz = $('#dropZone');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
  dz.addEventListener('dragleave',e=>{dz.classList.remove('dragover');});
  dz.addEventListener('drop',e=>{
    e.preventDefault();dz.classList.remove('dragover');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
}

init();
</script>
</body>
</html>
